# CI deploy identity. Scoped to the ks-bot namespace only — the RoleBinding
# grants the built-in `admin` ClusterRole *within* this namespace, so the token
# cannot touch ks-redeem or anything else in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ks-bot-deployer
  namespace: ks-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ks-bot-deployer-admin
  namespace: ks-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: ks-bot-deployer
    namespace: ks-bot
---
apiVersion: v1
kind: Secret
metadata:
  name: ks-bot-deployer-token
  namespace: ks-bot
  annotations:
    kubernetes.io/service-account.name: ks-bot-deployer
type: kubernetes.io/service-account-token
