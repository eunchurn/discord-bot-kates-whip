apiVersion: apps/v1
kind: Deployment
metadata:
  name: kates-whip
  labels:
    app: kates-whip
spec:
  replicas: 1
  # Two pods would double-send every reminder and give SQLite two writers,
  # so never let a new pod overlap the old one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kates-whip
  template:
    metadata:
      labels:
        app: kates-whip
    spec:
      restartPolicy: Always
      # The image runs as the unprivileged `bun` user (uid/gid 1000), but a
      # freshly provisioned volume is owned by root and shadows the image's
      # /data. fsGroup makes the kubelet hand the mount to gid 1000, otherwise
      # `prisma migrate deploy` fails with "unable to open database file".
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # The exp-worker pool (Rocky Linux) has no outbound egress on :443, so
      # the bot cannot reach Discord there. These two nodes have egress and are
      # the only ones the openebs-lvm-fiserver storage class provisions on.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - danbi-fi-server-1
                      - danbi-server-2
      containers:
        - name: kates-whip
          image: ghcr.io/eunchurn/discord-bot-kates-whip:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kates-whip-secret
                  key: DISCORD_TOKEN
            - name: DATABASE_URL
              value: file:/data/kates-whip.db
            - name: TICK_SECONDS
              value: "30"
            - name: DEFAULT_TIMEZONE
              value: "UTC"
            # Staff role, seeded as the event-managing role when the bot joins
            # a server it has not seen before. Existing servers keep whatever
            # /setup last stored, so changing this does not migrate them.
            - name: DEFAULT_ADMIN_ROLE_ID
              value: "1533245050287427755"
            - name: DEFAULT_LEAD_MINUTES
              value: "10,5"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kates-whip-data
